name: update-and-deploy

# 本番(main)は https://<user>.github.io/jleague-compare/ 、試作は同じサイトの /dev/ /blocks/ に載せる(ブランチ名=パス)。
# どのブランチの push でも「main + 試作ブランチ」を組み合わせて1回で公開するので、main に取り込むまで本番は変わらない。
on:
  schedule:  # UTC。JST = UTC+9
    - cron: "0,30 7-13 * * 0,6"    # 土日 JST 16:00〜22:30 の30分ごと(GitHubは定時実行を飛ばすことがあるので多めに)
    - cron: "30 11,12,13 * * 1-5"  # 平日 JST 20:30 / 21:30 / 22:30
  workflow_dispatch:
    inputs:
      seasons:
        description: "取得シーズン(空白区切り 例: 2021 2022 2023 2024 2025 2026)。空なら今季のみ。過去シーズン一括取得に使う"
        required: false
        default: ""
  push:
    branches: [main, dev, blocks]
    paths: [index.html, app.js, style.css, "data/**", .github/workflows/update.yml]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, path: site }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Fetch data (main only)
        if: github.event_name != 'push'
        working-directory: site
        env:
          SEASONS: ${{ inputs.seasons }}
        run: python scripts/fetch.py ${SEASONS:+--seasons $SEASONS}
      - name: Commit if changed
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "data: update" && git push)
      - name: Add prototype branches (if they exist)
        working-directory: site
        run: |
          for b in dev blocks; do
            if git fetch --depth=1 origin "$b"; then git worktree add --detach "../site-$b" FETCH_HEAD; fi
          done
      - name: Stage site
        run: |
          mkdir _site
          cp -r site/index.html site/app.js site/style.css site/data _site/
          for b in dev blocks; do
            if [ -d "site-$b" ]; then
              mkdir "_site/$b"
              cp -r "site-$b/index.html" "site-$b/app.js" "site-$b/style.css" "site-$b/data" "_site/$b/"
            fi
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - uses: actions/deploy-pages@v4
